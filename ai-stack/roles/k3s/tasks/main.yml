---
- name: Check installed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false

- name: Install k3s (pinned version)
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} sh -s - server \
      --cluster-init \
      --disable=traefik \
      --write-kubeconfig-mode=644
  args:
    executable: /bin/bash
  when: k3s_version not in (k3s_installed.stdout | default(''))
  register: k3s_install

- name: Wait for k3s API to be ready
  ansible.builtin.command: k3s kubectl get --raw=/readyz
  register: k3s_ready
  until: k3s_ready.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  when: k3s_install is changed or k3s_installed.rc != 0

- name: Wait for k3s kubeconfig file to be written
  ansible.builtin.wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    timeout: 120
    state: present

- name: Ensure /root/.kube directory exists
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0700"

- name: Symlink kubectl and k3s kubeconfig for convenience
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: /var/lib/rancher/k3s/data/current/bin/kubectl, dest: /usr/local/bin/kubectl }
    - { src: /etc/rancher/k3s/k3s.yaml, dest: /root/.kube/config }
  become: true

- name: Ensure ai-platform namespace exists
  ansible.builtin.copy:
    dest: /opt/ai-platform/manifests/namespace.yaml
    mode: "0644"
    content: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: {{ k8s_namespace }}

- name: Apply namespace
  ansible.builtin.command: kubectl apply -f /opt/ai-platform/manifests/namespace.yaml
  register: ns_apply
  changed_when: "'configured' in ns_apply.stdout or 'created' in ns_apply.stdout"
