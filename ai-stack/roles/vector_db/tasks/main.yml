---
- name: Render qdrant manifest
  ansible.builtin.template:
    src: qdrant.yaml.j2
    dest: /opt/ai-platform/manifests/qdrant.yaml
    mode: "0644"

- name: Apply qdrant manifest
  ansible.builtin.command: kubectl apply -f /opt/ai-platform/manifests/qdrant.yaml
  register: qdrant_apply
  changed_when: "'configured' in qdrant_apply.stdout or 'created' in qdrant_apply.stdout"

- name: Wait for qdrant rollout
  ansible.builtin.command: kubectl rollout status deployment/qdrant -n {{ k8s_namespace }} --timeout=300s
  changed_when: false
