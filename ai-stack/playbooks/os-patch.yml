---
# OS security patching. Safe on multi-node clusters because of `serial: 1`:
# Ansible processes ONE node at a time — patch, reboot if needed, verify the
# node rejoined the cluster — before moving to the next. The cluster always
# keeps N-1 healthy nodes, so workloads stay up (with replicas=2 in prod).
- name: Patch OS security updates
  hosts: all
  become: true
  serial: 1
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all/vault.yml"
    - "{{ playbook_dir }}/../group_vars/all.yml"
    - "{{ playbook_dir }}/../group_vars/releases/{{ release }}.yml"
  tasks:
    - name: Skip when release does not require OS patching
      ansible.builtin.meta: end_play
      when: not (os_patching | default(false))

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Apply security updates only (unattended-upgrades style)
      ansible.builtin.shell: |
        apt-get -y -o Dpkg::Options::="--force-confdef" \
               -o Dpkg::Options::="--force-confold" upgrade
      register: apt_upgrade
      changed_when: "' upgraded,' in apt_upgrade.stdout or ' newly installed,' in apt_upgrade.stdout or 'The following packages will be upgraded' in apt_upgrade.stdout"

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Drain node from k3s (only if reboot needed)
      ansible.builtin.shell: |
        NODE=$(kubectl get nodes -o jsonpath='{.items[?(@.status.nodeInfo.hostname=="'"$(hostname -s)"'")].metadata.name}' 2>/dev/null || kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
        kubectl drain "$NODE" --ignore-daemonsets --delete-emptydir-data --timeout=300s
      when: reboot_required.stat.exists
      changed_when: true

    - name: Reboot if required
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: reboot_required.stat.exists

    - name: Uncordon node after reboot
      ansible.builtin.shell: |
        NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
        kubectl uncordon "$NODE"
      when: reboot_required.stat.exists
      changed_when: true

    - name: Wait for node to be Ready again
      ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=300s
      when: reboot_required.stat.exists
      changed_when: false

    - name: Report node patched
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} patched. Reboot was {{ 'required and performed' if reboot_required.stat.exists else 'not required' }}."
