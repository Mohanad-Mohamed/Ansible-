---
# OWN SCENARIO: rotate the LiteLLM master key AND the PostgreSQL password
# with (near-)zero downtime.
#   ansible-playbook -i inventories/staging playbooks/rotate-secrets.yml -e release=1.0
#
# Why this scenario: credential rotation is a routine on-prem operation
# (CVE response, staff turnover, compliance). Doing it wrong = outage.
#
# HOW IT WORKS:
#  1. Generate new random secrets (never logged).
#  2. ALTER ROLE inside Postgres — takes effect for NEW connections
#     immediately; existing connections keep working until they reconnect.
#  3. Update the k8s Secrets (postgres-credentials, litellm-credentials).
#  4. Rolling-restart LiteLLM so it reconnects with the new DATABASE_URL
#     and master key. With replicas>=2 this is zero-downtime; with 1 replica
#     there are a few seconds of unavailability (documented).
#  5. Old master key stops working as soon as the pod restarts — rotate any
#     automation that uses it (see generated-secrets.json -> vault update).
- name: Rotate LiteLLM master key and Postgres password
  hosts: all
  become: true
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all/vault.yml"
    - "{{ playbook_dir }}/../group_vars/all.yml"
    - "{{ playbook_dir }}/../group_vars/releases/{{ release }}.yml"
  tasks:
    - name: Generate new secrets (not logged)
      ansible.builtin.set_fact:
        new_pg_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        new_master_key: "sk-{{ lookup('password', '/dev/null length=40 chars=ascii_letters,digits') }}"
      no_log: true

    - name: Apply new Postgres password inside the database
      ansible.builtin.command: >-
        kubectl exec -n {{ k8s_namespace }} deploy/postgres --
        psql -U {{ vault_postgres_user }} -d {{ vault_postgres_db }} -c
        "ALTER USER {{ vault_postgres_user }} WITH PASSWORD '{{ new_pg_password }}'"
      no_log: true
      changed_when: true

    - name: Update postgres-credentials secret
      ansible.builtin.shell: |
        kubectl create secret generic postgres-credentials -n {{ k8s_namespace }} \
          --from-literal=username='{{ vault_postgres_user }}' \
          --from-literal=password='{{ new_pg_password }}' \
          --from-literal=database='{{ vault_postgres_db }}' \
          --dry-run=client -o yaml | kubectl apply -f -
      no_log: true
      changed_when: true

    - name: Update litellm-credentials secret (new master key + new DATABASE_URL)
      ansible.builtin.shell: |
        kubectl create secret generic litellm-credentials -n {{ k8s_namespace }} \
          --from-literal=master_key='{{ new_master_key }}' \
          --from-literal=database_url='postgresql://{{ vault_postgres_user }}:{{ new_pg_password }}@postgres:5432/{{ vault_postgres_db }}' \
          --dry-run=client -o yaml | kubectl apply -f -
      no_log: true
      changed_when: true

    - name: Rolling restart LiteLLM to pick up new secrets
      ansible.builtin.command: kubectl rollout restart deploy/litellm -n {{ k8s_namespace }}
      changed_when: true

    - name: Wait for LiteLLM rollout
      ansible.builtin.command: kubectl rollout status deploy/litellm -n {{ k8s_namespace }} --timeout=300s
      changed_when: false

    - name: Write new secrets to local file for vault update (git-ignored, mode 600)
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../rotated-secrets.json"
        mode: "0600"
        content: |
          {
            "vault_postgres_password": "{{ new_pg_password }}",
            "vault_litellm_master_key": "{{ new_master_key }}"
          }
      no_log: true

    - name: Remind operator to update vault and redeploy
      ansible.builtin.debug:
        msg: >-
          Secrets rotated. Copy rotated-secrets.json values into
          group_vars/all/vault.yml (vault_postgres_password,
          vault_litellm_master_key), re-run ansible-vault encrypt, then
          re-run site.yml so manifests stay in sync. Delete rotated-secrets.json.

    - name: Run smoke test with NEW master key (pod env already updated)
      ansible.builtin.include_role:
        name: smoke_test
